<!DOCTYPE html>
<html lang="en">

<head>
    <title>Vietnam Heatmap Layer</title>
    <meta property="og:description" content="Visualize data density using a heatmap layer." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://unpkg.com/@vietmap/vietmap-gl-js@6.0.1/dist/vietmap-gl.js"></script>
    <link href="https://unpkg.com/@vietmap/vietmap-gl-js@6.0.1/dist/vietmap-gl.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #map {
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        const urlTile = 'https://local.map.zone/api/tiles/84598746-54de-49a9-8bf3-6106b865e39f/{z}/{x}/{y}.mvt';
        const SOURCE_LAYER = '84598746-54de-49a9-8bf3-6106b865e39f';

        const map = new vietmapgl.Map({
            container: 'map',
            style: 'https://maps.vietmap.vn/maps/styles/tm/style.json?apikey=YOUR_API_KEY_HERE',
            center: [108.2022, 16.0544],
            zoom: 5
        });

        map.on('load', () => {
            map.addSource('heatmap-source', {
                type: 'vector',
                tiles: [urlTile]
            });

            map.addLayer({
                'id': 'heatmap-layer',
                'type': 'heatmap',
                'source': 'heatmap-source',
                'source-layer': SOURCE_LAYER,
                'maxzoom': 20,
                'paint': {
                    'heatmap-weight': 1,
                    'heatmap-intensity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        0,
                        1,
                        9,
                        3
                    ],
                    'heatmap-color': [
                        'interpolate',
                        ['linear'],
                        ['heatmap-density'],
                        0,
                        'rgba(33,102,172,0)',
                        0.2,
                        'rgb(103,169,207)',
                        0.4,
                        'rgb(209,229,240)',
                        0.6,
                        'rgb(253,219,199)',
                        0.8,
                        'rgb(239,138,98)',
                        1,
                        'rgb(178,24,43)'
                    ],
                    'heatmap-radius': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        0,
                        2,
                        9,
                        20
                    ],
                }
            });
        });
    </script>
</body>

</html>
